run:
  output_dir: outputs/llada2-mini-estf
  seed: 42
  max_steps: 1000
  num_train_epochs: 1

recipe:
  name: estf
  params:
    block_size: 32
    max_stages: 4
    confidence_threshold: 0.85
    confidence_source: maximum
    selective_loss: false
    initialize_random_known: true
    initial_known_ratio: [0.1, 0.6]
    initial_known_schedule_power: 2.0

model:
  provider: llada2
  config_path: configs/model_configs/llada2_mini
  weights_path: /path/to/block-diffusion/model
  tokenizer_path: /path/to/original/model
  attention: flex_attention
  moe: fused
  init_device: meta
  mask_token_id: 156895
  eos_token_id: 156892
  pad_token_id: 126081

data:
  source: jsonl
  path: /path/to/token-records.jsonl
  format: token_records
  text_key: input_ids
  max_seq_len: 2048
  packing: true
  num_workers: 8

distributed:
  mode: fsdp2
  dp: 8
  dp_replicate: 1
  ep: 1
  activation_offload: false
  gradient_checkpointing: true

optimization:
  optimizer: adamw
  lr: 2.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  scheduler: constant
  warmup_ratio: 0.0
  decay_ratio: 1.0
  min_lr: 2.0e-5
  global_batch_size: 8
  micro_batch_size: 1
  max_grad_norm: 0.1

checkpoint:
  resume_from: null
  save_every_steps: 1000
  save_every_epochs: 1
  save_hf_weights: true

logging:
  report_to: [stdout]
  log_every_steps: 10
